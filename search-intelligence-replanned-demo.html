    (() => {
      const root = document.getElementById('si-replanned-demo');
      const content = root.querySelector('#si-content');
      const granularityEl = root.querySelector('#si-granularity');

      }
      function showTooltip(target){
        const text=target?.dataset?.tooltip;if(!text)return;tooltipEl.textContent=text;tooltipEl.style.display='block';
        const rect=target.getBoundingClientRect(), width=tooltipEl.offsetWidth, height=tooltipEl.offsetHeight;
        tooltipEl.style.left=`${Math.max(8,Math.min(window.innerWidth-width-8,rect.right-width))}px`;
        tooltipEl.style.top=`${Math.max(8,rect.top-height-8)}px`;
      }
      function hideTooltip(){tooltipEl.style.display='none';}

      root.addEventListener('click',e=>{
        if(e.target.closest('.si-help'))return;
        const follow=e.target.closest('[data-follow-type]');if(follow){toggleFavorite(follow.dataset.followType,follow.dataset.followValue);return;}
        const favorite=e.target.closest('[data-open-favorite-type]');if(favorite){openFavorite(favorite.dataset.openFavoriteType,favorite.dataset.openFavoriteValue);return;}
        const download=e.target.closest('[data-download-table]');if(download){downloadTable(download.dataset.downloadTable,download.dataset.downloadName);return;}
        const tablePage=e.target.closest('[data-table-page]');if(tablePage){const table=state.tables[tablePage.dataset.tablePage];table.page=Math.max(1,table.page+Number(tablePage.dataset.pageStep));if(state.page==='brand')brandPage();else if(state.page==='keyword')keywordPage();return;}
        const drill=e.target.closest('[data-drill]');if(drill&&!e.target.closest('button,input,select,a')){performDrill(drill.dataset.drill);return;}
        const page=e.target.closest('[data-page]'); if(page){state.page=page.dataset.page;root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-selected',String(b===page)));render();return;}
        const gran=e.target.closest('[data-granularity]'); if(gran){state.granularity=gran.dataset.granularity;state.openDetail=null;render();return;}
        const trendGran=e.target.closest('[data-trend-granularity]'); if(trendGran){const key=trendGran.dataset.trendKey,granularity=trendGran.dataset.trendGranularity;state.trends[key].granularity=granularity;state.trends[key].range=granularity==='day'?30:granularity==='week'?8:12;render();return;}
        const bt=e.target.closest('[data-brand-tab]'); if(bt){state.brandTab=bt.dataset.brandTab;render();return;}
        const kt=e.target.closest('[data-keyword-tab]'); if(kt){state.keywordTab=kt.dataset.keywordTab;state.openDetail=null;render();return;}
        const sc=e.target.closest('[data-scope]'); if(sc){state.scope=sc.dataset.scope;render();return;}
        const open=e.target.closest('[data-open-keyword]'); if(open){state.page='keyword';state.keyword=open.dataset.openKeyword;state.keywordTab='trend';syncNavigation();render();return;}
        const detail=e.target.closest('[data-detail-row]'); if(detail){const i=Number(detail.dataset.detailRow);state.openDetail=state.openDetail===i?null:i;keywordPage();return;}
        const addKeyword=e.target.closest('[data-add-compare-keyword]'); if(addKeyword){addCompareKeyword(root.querySelector('#si-compare-keyword-input')?.value);return;}
        const removeKeyword=e.target.closest('[data-remove-compare-keyword]'); if(removeKeyword){state.compareKeywords=state.compareKeywords.filter(term=>term!==removeKeyword.dataset.removeCompareKeyword);keywordPage();return;}
      });
      root.addEventListener('input',e=>{
        const id=e.target.id, raw=e.target.value.trim();
        if(id==='si-brand'){const value=matchValue(raw,BRANDS);if(value&&value!==state.brand){state.brand=value;brandPage();}}
        if(id==='si-compare-brand-a'){const value=matchValue(raw,BRANDS);if(value&&value!==state.compareBrands[0]&&value!==state.compareBrands[1]){state.compareBrands[0]=value;brandPage();}}
        if(id==='si-compare-brand-b'){const value=matchValue(raw,BRANDS);if(value&&value!==state.compareBrands[1]&&value!==state.compareBrands[0]){state.compareBrands[1]=value;brandPage();}}
        if(id==='si-opp-brand'){const value=raw?matchValue(raw,BRANDS):'';if((value||!raw)&&value!==state.opportunityBrand){state.opportunityBrand=value;keywordPage();}}
        if(id==='si-quadrant-brand'){const value=raw?matchValue(raw,BRANDS):'';if((value||!raw)&&value!==state.quadrantBrand){state.quadrantBrand=value;keywordPage();}}
        if(id==='si-detail-keyword'){const value=raw?matchValue(raw,KEYWORDS.map(item=>item.term)):'all';if(value&&value!==state.detailKeyword){state.detailKeyword=value;state.openDetail=null;keywordPage();}}
        if(id==='si-detail-brand'){const value=raw?matchValue(raw,BRANDS):'';if((value||!raw)&&value!==state.detailBrand){state.detailBrand=value;state.openDetail=null;keywordPage();}}
      });
      root.addEventListener('keydown',e=>{
        if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-drill]')){e.preventDefault();performDrill(e.target.dataset.drill);return;}
        if(e.key!=='Enter')return;
        if(e.target.id==='si-overview-table-search'){state.overviewTableSearch=e.target.value;overview();}
        if(e.target.id==='si-brand-keyword-search'){state.brandKeywordSearch=e.target.value;brandPage();}
        if(e.target.id==='si-leaderboard-search'){state.leaderboardSearch=e.target.value;brandPage();}
        if(e.target.id==='si-quadrant-table-search'){state.quadrantTableSearch=e.target.value;keywordPage();}
        if(e.target.id==='si-opp-search'){state.opportunitySearch=e.target.value;keywordPage();}
        if(e.target.id==='si-keyword'){const value=e.target.value.trim();if(value){state.keyword=value;keywordPage();}}
        if(e.target.id==='si-detail-keyword'){state.detailKeyword=e.target.value.trim()||'all';state.openDetail=null;keywordPage();}
        if(e.target.id==='si-compare-keyword-input')addCompareKeyword(e.target.value);
      });
      root.addEventListener('change',e=>{
        const id=e.target.id;
        if(id==='si-period'){const index=currentGroup().labels.indexOf(e.target.value);if(index>=0)state.snapshotIndex[state.granularity]=index;state.openDetail=null;render();}
        if(id==='si-brand'){const value=matchValue(e.target.value,BRANDS);if(value)state.brand=value;brandPage();}
        if(id==='si-compare-brand-a')setCompareBrand(0,e.target.value);
        if(id==='si-compare-brand-b')setCompareBrand(1,e.target.value);
        if(id==='si-brand-metric'){state.brandMetric=e.target.value;brandPage();}
        if(id==='si-keyword'){const value=e.target.value.trim();if(value)state.keyword=value;keywordPage();}
        if(id==='si-overview-table-search'){state.overviewTableSearch=e.target.value;overview();}
        if(id==='si-overview-table-category'){state.overviewTableCategory=e.target.value;overview();}
        if(id==='si-overview-table-type'){state.overviewTableType=e.target.value;overview();}
        if(id==='si-brand-keyword-search'){state.brandKeywordSearch=e.target.value;state.tables.brandKeywords.page=1;brandPage();}
        if(id==='si-brand-keyword-category'){state.brandKeywordCategory=e.target.value;state.tables.brandKeywords.page=1;brandPage();}
        if(id==='si-brand-keyword-trend'){state.brandKeywordTrend=e.target.value;state.tables.brandKeywords.page=1;brandPage();}
        if(id==='si-leaderboard-search'){state.leaderboardSearch=e.target.value;brandPage();}
        if(id==='si-leaderboard-growth'){state.leaderboardGrowth=e.target.value;brandPage();}
        if(id==='si-quadrant-table-search'){state.quadrantTableSearch=e.target.value;keywordPage();}
        if(id==='si-quadrant-table-category'){state.quadrantTableCategory=e.target.value;keywordPage();}
        if(id==='si-opp-search'){state.opportunitySearch=e.target.value;state.tables.opportunities.page=1;keywordPage();}
        if(id==='si-opp-category'){state.opportunityCategory=e.target.value;state.tables.opportunities.page=1;keywordPage();}
        if(id==='si-opp-kind'){state.opportunityKind=e.target.value;state.tables.opportunities.page=1;keywordPage();}
        if(id==='si-opp-brand'){state.opportunityBrand=e.target.value.trim()?matchValue(e.target.value,BRANDS):'';state.tables.opportunities.page=1;keywordPage();}
        if(id==='si-quadrant-brand'){state.quadrantBrand=e.target.value.trim()?matchValue(e.target.value,BRANDS):'';keywordPage();}
        if(id==='si-detail-keyword'){state.detailKeyword=e.target.value.trim()||'all';state.openDetail=null;keywordPage();}
        if(id==='si-detail-brand'){state.detailBrand=e.target.value.trim()?matchValue(e.target.value,BRANDS):'';state.openDetail=null;keywordPage();}
        if(id==='si-detail-status'){state.detailStatus=e.target.value;state.openDetail=null;keywordPage();}
        if(e.target.matches('[data-trend-range]')){const key=e.target.dataset.trendRange;state.trends[key].range=Number(e.target.value);render();}
        if(e.target.matches('[data-table-size]')){const table=state.tables[e.target.dataset.tableSize];table.size=Number(e.target.value);table.page=1;if(state.page==='brand')brandPage();else if(state.page==='keyword')keywordPage();}
      });
      root.addEventListener('mouseover',e=>{const target=e.target.closest('[data-tooltip]');if(target)showTooltip(target);});
      root.addEventListener('mouseout',e=>{const target=e.target.closest('[data-tooltip]');if(target&&!target.contains(e.relatedTarget))hideTooltip();});
      root.addEventListener('focusin',e=>{const target=e.target.closest('[data-tooltip]');if(target)showTooltip(target);});
      root.addEventListener('focusout',e=>{if(e.target.closest('[data-tooltip]'))hideTooltip();});
      const observer=new ResizeObserver(()=>{if(chartJob)requestAnimationFrame(()=>chartJob&&chartJob())}); observer.observe(root);
      render();
      loadRealData().then(()=>render());
    })();
  </script>
</div>
